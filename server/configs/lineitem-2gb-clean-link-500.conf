openapi = "http://127.0.0.1:18600/lineitem/2gb/clean/openapi.yaml"
auth { type = none }
pagination {
 style = link_header
 page-size-param = limit
 max-page-size = 500
 max-pages = 100000
}
schema { flatten-depth = 2, array-handling = keep_array }
http { max-retries = 5, max-backoff = 30s, timeout = 60s }
tables { records { endpoint = "/link", data-path = "/results" } }
