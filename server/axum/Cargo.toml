[package]
name = "synthetic-rest-axum"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "=0.8.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "fs", "io-util", "time", "signal"] }
tokio-util = { version = "0.7", features = ["io"] }
async-compression = { version = "0.4", features = ["tokio", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
httpdate = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
